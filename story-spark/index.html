<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Spark</title>
<style>
  :root {
    --bg: #fff8ee;
    --ink: #2b2140;
    --muted: #7a6f8c;
    --card: #ffffff;
    --line: #eadfce;
    --accent: #ff6b4a;
    --accent-ink: #ffffff;
    --lock: #3aa37a;
    --shadow: 0 6px 20px rgba(60, 40, 90, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1827;
      --ink: #f4eefc;
      --muted: #a79cba;
      --card: #28223a;
      --line: #3a3350;
      --accent: #ff7d5e;
      --lock: #4fc497;
      --shadow: 0 6px 20px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0; font-size: 2rem; letter-spacing: -.02em; }
  .sub { margin: 4px 0 24px; color: var(--muted); }

  .reels { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .reel {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 10px;
    transition: border-color .2s;
  }
  .reel.locked { border-color: var(--lock); }
  .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .window {
    height: 72px; overflow: hidden; position: relative;
    display: flex; align-items: center;
  }
  .value { font-size: 1.15rem; font-weight: 650; }
  .window.spinning .value { animation: blur .09s linear infinite; }
  @keyframes blur {
    0% { transform: translateY(-8px); opacity: .4; }
    50% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(8px); opacity: .4; }
  }
  .lock-btn {
    align-self: flex-start;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 4px 12px; font: inherit; font-size: .85rem; cursor: pointer;
  }
  .reel.locked .lock-btn { background: var(--lock); border-color: var(--lock); color: #fff; }

  .sentence {
    margin: 20px 0; padding: 16px 18px;
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    font-size: 1.1rem; min-height: 3.2em;
  }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  button.primary, button.secondary {
    font: inherit; font-weight: 650; border-radius: 12px; padding: 12px 20px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 0; font-size: 1.05rem; }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled { opacity: .6; cursor: wait; }
  button.secondary { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 8px; }

  h2 { margin: 36px 0 10px; font-size: 1.2rem; }
  ul.saved { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  ul.saved li {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start;
  }
  ul.saved li span { flex: 1; }
  ul.saved button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1rem;
  }
  .empty { color: var(--muted); font-style: italic; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>✨ Story Spark</h1>
  <p class="sub">Pull the lever to get a story idea. Lock the parts you like and spin again.</p>

  <section class="reels" id="reels"></section>

  <p class="sentence" id="sentence" aria-live="polite"></p>

  <div class="controls">
    <button class="primary" id="spin">🎰 Spin</button>
    <button class="secondary" id="save">⭐ Save</button>
    <button class="secondary" id="copy">📋 Copy</button>
  </div>
  <p class="hint">Keys: <b>Space</b> spins · <b>1</b> <b>2</b> <b>3</b> lock reels · <b>S</b> saves</p>

  <h2>Saved sparks</h2>
  <ul class="saved" id="saved"></ul>
</main>
<div class="toast" id="toast"></div>

<script>
const REELS = [
  {
    label: "Hero",
    items: [
      "a shy dragon", "a grandma who races go-karts", "a sock that escaped the laundry",
      "a robot who's afraid of the dark", "a very small giant", "a hedgehog with a secret umbrella",
      "twin sisters who swapped shadows", "a cloud that wants to be a pillow", "a snail on a deadline",
      "a lighthouse keeper's cat", "a boy who can hear colors", "a retired superhero",
      "the last crayon in the box", "a penguin who hates the cold", "a moon that got lost"
    ]
  },
  {
    label: "Place",
    items: [
      "in a library at midnight", "on the back of a sleeping whale", "inside a snow globe",
      "at the bottom of a teacup", "on a train that never stops", "in a bakery run by bears",
      "on the first day of school", "in a treehouse city", "under Grandpa's bed",
      "in a garden where it's always autumn", "at a lost-and-found for dreams",
      "on a rainy Tuesday in a tiny town", "inside a giant's pocket", "at a museum after closing"
    ]
  },
  {
    label: "Problem",
    items: [
      "who lost their echo", "who must return a borrowed star", "who can't stop sneezing glitter",
      "who has to make a new friend by sunset", "who wakes up invisible",
      "who accidentally shrank the teacher", "who is scared of their own birthday",
      "who has to find the missing letter Q", "whose wishes come true backwards",
      "who promised to keep a very loud secret", "who must teach the wind to whistle",
      "who has one day to find a home", "who broke the rainbow"
    ]
  }
];

const STORE_KEY = "story-spark-saved";
const state = { values: REELS.map(r => pick(r.items)), locked: REELS.map(() => false), spinning: false };

const $ = id => document.getElementById(id);
const reelsEl = $("reels");

function pick(arr, not) {
  let v;
  do { v = arr[Math.floor(Math.random() * arr.length)]; } while (arr.length > 1 && v === not);
  return v;
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function sentence() { return capitalize(state.values.join(" ")) + "."; }

function renderReels() {
  reelsEl.innerHTML = "";
  REELS.forEach((reel, i) => {
    const card = document.createElement("div");
    card.className = "reel" + (state.locked[i] ? " locked" : "");
    card.innerHTML = `
      <div class="label">${i + 1} · ${reel.label}</div>
      <div class="window" id="win${i}"><div class="value" id="val${i}"></div></div>
      <button class="lock-btn" data-i="${i}">${state.locked[i] ? "🔒 Locked" : "🔓 Lock"}</button>`;
    reelsEl.appendChild(card);
    card.querySelector(`#val${i}`).textContent = state.values[i];
  });
  $("sentence").textContent = sentence();
}

function toggleLock(i) {
  if (state.spinning) return;
  state.locked[i] = !state.locked[i];
  renderReels();
}

reelsEl.addEventListener("click", e => {
  const btn = e.target.closest(".lock-btn");
  if (btn) toggleLock(Number(btn.dataset.i));
});

function spin() {
  if (state.spinning) return;
  if (state.locked.every(Boolean)) { toast("Unlock a reel to spin"); return; }
  state.spinning = true;
  $("spin").disabled = true;

  const finished = REELS.map((reel, i) => new Promise(resolve => {
    if (state.locked[i]) return resolve();
    const win = $("win" + i), val = $("val" + i);
    win.classList.add("spinning");
    const tick = setInterval(() => { val.textContent = pick(reel.items); }, 70);
    // Reels stop one after another, left to right.
    setTimeout(() => {
      clearInterval(tick);
      win.classList.remove("spinning");
      state.values[i] = pick(reel.items, state.values[i]);
      val.textContent = state.values[i];
      resolve();
    }, 600 + i * 350);
  }));

  Promise.all(finished).then(() => {
    state.spinning = false;
    $("spin").disabled = false;
    $("sentence").textContent = sentence();
  });
}

function loadSaved() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; }
}
function writeSaved(list) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch {}
}

function renderSaved() {
  const list = loadSaved();
  const ul = $("saved");
  ul.innerHTML = "";
  if (!list.length) {
    ul.innerHTML = `<li class="empty">Nothing saved yet. Tap ⭐ Save when an idea makes you smile.</li>`;
    return;
  }
  list.forEach((text, idx) => {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = text;
    const del = document.createElement("button");
    del.textContent = "✕";
    del.title = "Remove";
    del.onclick = () => { const l = loadSaved(); l.splice(idx, 1); writeSaved(l); renderSaved(); };
    li.append(span, del);
    ul.appendChild(li);
  });
}

function save() {
  if (state.spinning) return;
  const list = loadSaved();
  const s = sentence();
  if (list.includes(s)) { toast("Already saved"); return; }
  list.unshift(s);
  writeSaved(list);
  renderSaved();
  toast("Saved ⭐");
}

async function copy() {
  try { await navigator.clipboard.writeText(sentence()); toast("Copied 📋"); }
  catch { toast("Couldn't copy, so select the text instead"); }
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}

$("spin").onclick = spin;
$("save").onclick = save;
$("copy").onclick = copy;

document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.code === "Space") { e.preventDefault(); spin(); }
  else if (/^[1-9]$/.test(e.key) && Number(e.key) <= REELS.length) toggleLock(Number(e.key) - 1);
  else if (e.key.toLowerCase() === "s") save();
});

renderReels();
renderSaved();
</script>
</body>
</html>
